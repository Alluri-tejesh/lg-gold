name: Validate Full Stack
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:data
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npm run test:server
# Deploy the Dockerfile / Node server on an HTTPS backend host connected to Atlas.
# A static GitHub Pages deployment cannot run account or order APIs.
