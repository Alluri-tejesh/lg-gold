name: Add or update product

# Run this by hand: GitHub, Actions tab, "Add or update product", Run workflow.
# It adds a new product with its picture, adds or removes a pack size (also on HMT and JSR),
# changes a product's picture or text, or removes a product you added.
# The change is committed to main and the site is redeployed.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        default: "add or update product"
        options:
          - "add or update product"
          - "remove pack size"
          - "remove product"
      slug:
        description: "Product id: lowercase and dashes, e.g. basmati-rice. Use hmt-rice or jsr-rice to change those."
        required: true
        type: string
      name:
        description: "Full name, e.g. LG Gold Basmati Rice (required for a new product)"
        required: false
        type: string
      short_name:
        description: "Short name for buttons, e.g. Basmati (optional)"
        required: false
        type: string
      subtitle:
        description: "One line under the name (optional)"
        required: false
        type: string
      description:
        description: "A few sentences about the product (optional)"
        required: false
        type: string
      image:
        description: "Picture: a public https link, or a file name you uploaded to public/products (required for a new product)"
        required: false
        type: string
      image_fit:
        description: "contain = show the whole picture (bag photos); cover = fill the frame (food photos)"
        required: false
        type: choice
        default: "contain"
        options:
          - "contain"
          - "cover"
      pack_size:
        description: "Pack size to add, change or remove (used with the price below)"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "5kg Bag"
          - "10kg Bag"
          - "26kg Bag"
          - "50kg Bag"
          - "other (type below)"
      custom_pack_size:
        description: "Other pack size, only if you chose 'other' above, e.g. 25kg Bag or 1kg Pouch"
        required: false
        type: string
      price:
        description: "Price in rupees for that pack"
        required: false
        type: string
      mrp:
        description: "MRP in rupees, the crossed-out price (optional)"
        required: false
        type: string
      stock:
        description: "Stock"
        required: true
        type: choice
        default: "no change"
        options:
          - "no change"
          - "in stock"
          - "out of stock"

permissions:
  contents: write # commit the product and its picture
  actions: write # start the deploy workflow

concurrency:
  group: update-prices # shared with the price workflow, so the two never overwrite each other
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply the product change
        env:
          ACTION: ${{ inputs.action }}
          SLUG: ${{ inputs.slug }}
          NAME: ${{ inputs.name }}
          SHORT_NAME: ${{ inputs.short_name }}
          SUBTITLE: ${{ inputs.subtitle }}
          DESCRIPTION: ${{ inputs.description }}
          IMAGE: ${{ inputs.image }}
          IMAGE_FIT: ${{ inputs.image_fit }}
          PACK_SIZE: ${{ inputs.pack_size }}
          CUSTOM_PACK_SIZE: ${{ inputs.custom_pack_size }}
          PRICE: ${{ inputs.price }}
          MRP: ${{ inputs.mrp }}
          STOCK: ${{ inputs.stock }}
        run: node scripts/update-catalog.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the change
        id: commit
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog.json public/prices.json public/products
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "These values match what is already on the site, so nothing was changed." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore(catalog): update product $SLUG"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the built-in token does not start other workflows, so start the deploy directly.
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref main
          echo "The site is rebuilding. The change is live in about 2 minutes." >> "$GITHUB_STEP_SUMMARY"
