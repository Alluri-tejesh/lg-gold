<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LG Gold Rice</title>
    <meta name="description" content="LG Gold by Sri Lakshmi Ganapathi Trading Company: aged, Sortex-cleaned HMT and JSR rice in 26kg bags for homes, wholesale, bulk and export." />
    <meta name="theme-color" content="#174A32" />
    <meta name="robots" content="index,follow" />

    <!-- Link previews on WhatsApp, Facebook, LinkedIn and X -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LG Gold Rice" />
    <meta property="og:title" content="LG Gold Rice" />
    <meta property="og:description" content="Aged, Sortex-cleaned HMT and JSR rice in 26kg bags for homes, wholesale, bulk and export." />
    <meta property="og:image" content="og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- Tells search engines who the business is, where it is and how to reach it -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "LG Gold Rice - Sri Lakshmi Ganapathi Trading Company",
        "description": "Rice mill and trader supplying aged HMT and JSR rice for retail, wholesale, bulk and export.",
        "telephone": "+91 97015 35231",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "VG3P+G6, Miryalaguda",
          "addressRegion": "Telangana",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          "opens": "08:00",
          "closes": "20:00"
        },
        "brand": { "@type": "Brand", "name": "LG Gold" }
      }
    </script>

    <style>
      /*
       * Loader: the official logo with a gold ring sweeping round it. Shown while the site starts (index.html) and
       * while a page loads (BrandLoader in React, which reuses these classes).
       */
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f8f5ea; }
      .bl-wrap { display: flex; flex-direction: column; align-items: center; }
      .bl { position: relative; width: 150px; height: 150px; }
      .bl img { width: 100%; height: 100%; display: block; mix-blend-mode: multiply; }
      .bl svg { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); overflow: visible; }
      .bl-sm .bl { width: 112px; height: 112px; }
      .bl-ring { transform-origin: 60px 60px; stroke-dasharray: 18 82; animation: bl-spin 1.6s cubic-bezier(.55,.15,.45,.85) infinite, bl-sweep 3.2s ease-in-out infinite; }
      .bl-word { margin-top: 20px; font: 700 22px/1 'Playfair Display', Georgia, serif; letter-spacing: .08em; color: #174a32; }
      .bl-word span { color: #b38a17; }
      .bl-sm .bl-word { font-size: 18px; margin-top: 16px; }
      .bl-tag { margin-top: 10px; font: 600 11px/1 Inter, system-ui, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #8a650c; animation: bl-tag 2.4s ease-in-out infinite; }
      @keyframes bl-spin { to { transform: rotate(360deg); } }
      @keyframes bl-sweep { 0%, 100% { stroke-dasharray: 10 90; } 50% { stroke-dasharray: 46 54; } }
      @keyframes bl-tag { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .bl-ring, .bl-tag { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash"><div role="status" aria-label="Loading LG Gold Rice" class="bl-wrap"><div class="bl"><img src="/logo.jpg" alt="" width="500" height="500"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bl-ring" cx="60" cy="60" r="49" fill="none" stroke="#D8B23A" stroke-width="2.4" stroke-linecap="round" pathLength="100"></circle></svg></div><p class="bl-word">LG <span>GOLD</span></p><p class="bl-tag">Fresh from our mill</p></div></div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        LG Gold Rice needs JavaScript to show prices and products. Call or WhatsApp us on +91 97015 35231.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
