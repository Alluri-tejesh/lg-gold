<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#174A32" />
    <meta name="robots" content="index,follow" />

    <!-- Link previews on WhatsApp, Facebook, LinkedIn and X -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LG Gold Rice" />
    <meta property="og:title" content="LG Gold Rice | Aged HMT &amp; JSR Rice, Direct from the Mill" />
    <meta property="og:description" content="Aged, Sortex-cleaned HMT and JSR rice in 26kg bags for homes, wholesale, bulk and export." />
    <meta property="og:image" content="og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- Tells search engines who the business is, where it is and how to reach it -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "LG Gold Rice - Sri Lakshmi Ganapathi Trading Company",
        "description": "Rice mill and trader supplying aged HMT and JSR rice for retail, wholesale, bulk and export.",
        "telephone": "+91 97015 35231",
        "email": "care@lggoldrice.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "VG3P+G6, Venkatadri Palem",
          "addressRegion": "Telangana",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          "opens": "08:00",
          "closes": "20:00"
        },
        "brand": { "@type": "Brand", "name": "LG Gold" }
      }
    </script>

    <style>
      /* Shown until the app has started (usually under a second), so the first paint is the brand, not a blank page. */
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f8f5ea; transition: opacity .3s ease; }
      #splash .ring { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #e7d59a; border-top-color: #174a32; animation: s 0.9s linear infinite; }
      #splash p { margin: 18px 0 0; font: 600 13px/1 system-ui, sans-serif; letter-spacing: .18em; color: #8a650c; text-transform: uppercase; text-align: center; }
      @keyframes s { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #splash .ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash" aria-label="Loading LG Gold Rice">
        <div>
          <div class="ring" style="margin: 0 auto"></div>
          <p>LG Gold Rice</p>
        </div>
      </div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        LG Gold Rice needs JavaScript to show prices and products. Call or WhatsApp us on +91 97015 35231.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
